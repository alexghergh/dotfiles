# fixes / improvements taken from https://github.com/maximilionus/lucidglyph

# FreeType stem darkening, lucidglyph 0.16.0's curve: 0.4px on stems up to
# 2.5px wide, fading to 0 at 4px; "Slight" hinting sends TrueType fonts through
# the auto-hinter, so the autofitter entries are what cover Inter and Noto
FREETYPE_PROPERTIES="autofitter:no-stem-darkening=0 autofitter:darkening-parameters=500,400,1000,400,2500,400,4000,0 cff:no-stem-darkening=0 type1:no-stem-darkening=0 t1cid:no-stem-darkening=0"

# Qt otherwise fakes bold on variable fonts on top of their real bold weight
QT_NO_SYNTHESIZED_BOLD=1
