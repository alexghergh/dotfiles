<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
Rules for icon fonts: the patched "Custom Icon Fonts" (~/.local/share/fonts) and
any other font that has icons but no letters.
-->
<fontconfig>

    <!--
    Add Custom Icon Fonts to the end of every font's fallback list, so any
    program that lacks an icon (private-use characters) finds it there; Qt apps,
    Plasma notifications included, don't find it otherwise.
    -->
    <match target="pattern">
        <edit name="family" mode="append_last">
            <string>Custom Icon Fonts</string>
        </edit>
    </match>

    <!--
    Keep icons at their designed weight. Stem darkening (see text-rendering.conf
    in environment.d) thickens anything FreeType hints, icons included; turning
    hinting off for icon fonts skips it.

    An icon font is recognized by having none of these: "&", or the first letter
    of the Cyrillic, Greek, Arabic, Chinese, Hebrew, Devanagari, Thai, Georgian,
    Armenian, Ethiopic, Tamil or Bengali scripts.

    Plasma's System Settings -> Fonts can write a rule into ../fonts.conf that
    turns hinting back on for every font; fonts.conf is read after this folder,
    so that rule would win and undo this one.
    -->
    <match target="font">
        <test name="charset" compare="not_contains"><charset><int>0x0026</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0410</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x03B1</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0639</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x4E2D</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x05D0</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0905</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0E01</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x10D0</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0531</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x12A0</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0B85</int></charset></test>
        <test name="charset" compare="not_contains"><charset><int>0x0985</int></charset></test>
        <edit name="hinting" mode="assign">
            <bool>false</bool>
        </edit>
    </match>

</fontconfig>
