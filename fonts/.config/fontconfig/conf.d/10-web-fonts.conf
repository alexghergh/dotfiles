<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
Font substitutions, mostly for web pages, so the browser uses the same fonts as
the rest of the desktop.

Each <alias> reads as "when a program asks for <family>, use the <prefer> font
instead". binding="strong" makes a rule win over Fedora's own rules; without it,
Fedora's 57-google-noto-sans.conf still puts Noto Sans first.
-->
<fontconfig>

    <!--
    Interface font. Web pages ask for "the system font" by naming the macOS or
    Windows UI font, or the generic sans-serif / system-ui; all of these get
    Inter, which KDE and GTK use for the desktop.

    Arial and Helvetica are left out on purpose: pages that name them were laid
    out for their exact letter widths, so they keep Fedora's look-alikes with
    the same widths (Liberation Sans for Arial, Nimbus Sans for Helvetica).
    -->
    <alias binding="strong">
        <family>sans-serif</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>system-ui</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>-apple-system</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>BlinkMacSystemFont</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>SF Pro Text</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>SF Pro Display</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Helvetica Neue</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Segoe UI</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Inter</family>
        <prefer><family>Inter Variable</family></prefer>
    </alias>

    <!--
    Code font. Every name web pages use for code goes to the generic
    "monospace", and the last rule picks the one font behind it; to switch code
    fonts, change only that last rule (and the font in wezterm.lua, which keeps
    its own list).

    The last rule has to stay below the others: fontconfig applies rules top to
    bottom, so a name first turns into "monospace", and only then into the
    actual font.
    -->
    <alias binding="strong">
        <family>Menlo</family>
        <prefer><family>monospace</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Monaco</family>
        <prefer><family>monospace</family></prefer>
    </alias>
    <alias binding="strong">
        <family>Consolas</family>
        <prefer><family>monospace</family></prefer>
    </alias>
    <alias binding="strong">
        <family>SF Mono</family>
        <prefer><family>monospace</family></prefer>
    </alias>
    <alias binding="strong">
        <family>ui-monospace</family>
        <prefer><family>monospace</family></prefer>
    </alias>

    <alias binding="strong">
        <family>monospace</family>
        <prefer><family>Cascadia Code</family></prefer>
    </alias>

</fontconfig>
