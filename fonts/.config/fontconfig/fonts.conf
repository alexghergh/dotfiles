<?xml version='1.0'?>
<!DOCTYPE fontconfig SYSTEM 'fonts.dtd'>
<fontconfig>
 <!-- inject Custom Icon Fonts into the universal fallback chain so Qt apps
        (including Plasma notifications) can find it for PUA (private use area)
        characters -->
 <match target="pattern">
  <edit mode="append_last" name="family">
   <string>Custom Icon Fonts</string>
  </edit>
  <!-- <edit name="family" mode="prepend"> -->
  <!--     <string>Custom Icon Fonts</string> -->
  <!-- </edit> -->

 </match>
 <match target="font">
  <edit mode="assign" name="hinting">
   <bool>true</bool>
  </edit>
 </match>
 <match target="font">
  <edit mode="assign" name="hintstyle">
   <const>hintslight</const>
  </edit>
 </match>
 <dir>~/.local/share/fonts</dir>
 <match target="font">
  <edit mode="assign" name="antialias">
   <bool>true</bool>
  </edit>
 </match>

 <!-- icon fonts (no "&" and no letters of any script) keep their design
      weight: with hinting off FreeType skips the auto-hinter, and with it the
      stem darkening; must stay below the hinting rule Plasma writes above -->
 <match target="font">
  <test name="charset" compare="not_contains"><charset><int>0x0026</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0410</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x03B1</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0639</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x4E2D</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x05D0</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0905</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0E01</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x10D0</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0531</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x12A0</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0B85</int></charset></test>
  <test name="charset" compare="not_contains"><charset><int>0x0985</int></charset></test>
  <edit name="hinting" mode="assign"><bool>false</bool></edit>
 </match>
</fontconfig>
