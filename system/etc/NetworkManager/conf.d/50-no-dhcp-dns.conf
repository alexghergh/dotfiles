# ignore the DNS servers that Wi-Fi and wired networks hand out, so lookups go
# to the global, system-wide servers in systemd-resolved; applies only to
# profiles that leave `ignore-auto-dns` at its default
[connection-no-dhcp-dns]
match-device=type:wifi,type:ethernet
ipv4.ignore-auto-dns=true
ipv6.ignore-auto-dns=true
