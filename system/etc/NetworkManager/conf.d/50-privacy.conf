# on wi-fi and wired networks, don't send the hostname to the network's DHCP
# server, and give each wired network its own random MAC address that stays the
# same for that network; Fedora already does the latter for wi-fi, in
# /usr/lib/NetworkManager/conf.d/22-wifi-mac-addr.conf
[connection-privacy]
match-device=type:wifi,type:ethernet
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
ethernet.cloned-mac-address=stable
